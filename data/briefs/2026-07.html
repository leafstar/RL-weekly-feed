        {"title": "OPE with Rewards Missing Not at Random", "id": "2606.20206", "venue": "ICML 2026", "note": "奖励 MNAR 破坏 ignorability 时，用 future state 作 shadow variable + bridge function 建立可识别性。"}
      ]
    },
    {
      "group": "博弈 / 分布式 / 其他工具",
      "items": [
        {"title": "Bilevel Optimization over Saddle Points of Zero-Sum Markov Games", "id": "2605.26654", "venue": "ICML 2026", "note": "零和马尔可夫博弈鞍点上的双层优化。"},
        {"title": "Exact Unlearning in RL", "id": "2606.04182", "venue": "ICML Spotlight", "note": "$\\rho$-TV-stable，遗忘代价仅重训的 $\\sqrt{\\ln T}$ 量级。"},
        {"title": "A Spectral Revisit of the Distributional Bellman Operator (Cramér)", "id": "2603.12576", "venue": "预印本", "note": "分布式 RL 算子的谱视角。"}
      ]
    }
  ],
  "sectionIII": [
    {"name": "Plasticity loss / dormant neurons", "status": "partial", "note": "活跃理论域(Lyle/Nikishin/Dohare)；I 区 B2(2603.21173)在给 OCP 理论 → 半覆盖，非空白。"},
    {"name": "Spurious rewards 也能提升 RLVR", "status": "filled", "note": "已被机制/clipping-bias 解释(A2 + 2512.16912)；作为方向已基本被占。"},
    {"name": "Final-window pretraining 决定 post-training(SFT 等价却分化)", "status": "open", "note": "本期真 open。经典 basin/ordering 只部分覆盖；见 I 区 B4。"},
    {"name": "Self-play 决策容量结构阈值 → 崩到 exploitation 吸引域 (2605.16315)", "status": "open", "note": "近年 sweep 新捞·经典 RL·真 gap。跨扑克/矩阵博弈/骰子且 DQN/PPO/REINFORCE/NFSP 全崩：reach-weighted contingent 决策容量降到 0 时相变式收敛到近最大 loss 的确定性吸引域，留一个 contingent decision 即免；机制=约束下 co-adaptation。主动搜仅返回该文 + 姊妹作(2605.16312 / 2605.22217)，无经典理论占坑 → 矩阵博弈最小模型里存活、相变可建模、在你 lane。"},
    {"name": "Primacy bias in deep RL (Nikishin 2022)", "status": "partial", "note": "与 plasticity 同源；部分已有理论，需 S2-key 复核。"},
    {"name": "Reward-model overoptimization (Goodhart) scaling 曲线", "status": "partial", "note": "经验规律清楚，形式理论有限；与 concentrability/Goodhart 部分重叠。"}
  ]
}
</script>

<script>
(function(){
  var DATA = JSON.parse(document.getElementById("brief-data").textContent);
  var ABS = function(id){ return "https://arxiv.org/abs/" + id; };
  var VENUE = {main:{cls:"b-main",label:"主会"}, ws:{cls:"b-ws",label:"Workshop"}, pre:{cls:"b-pre",label:"预印本"}};
  var STATUS = {open:{cls:"b-open",label:"真 gap"}, partial:{cls:"b-partial",label:"半覆盖"}, filled:{cls:"b-filled",label:"经典已覆盖"}};

  document.getElementById("doc-title").textContent = DATA.title;
  document.getElementById("doc-sub").textContent = DATA.sub || "";
  document.getElementById("notes-body").innerHTML = DATA.notes.map(function(n){return "<p>"+n+"</p>";}).join("");
  document.getElementById("foot").textContent = "生成于 " + DATA.generatedAt + " · arXiv 数据经人工/模型策划 · 公式由 KaTeX 渲染（需联网）";

  var state = {section:"all", domain:"all", venue:"all", status:"all", q:""};

  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function link(t,id){ return '<a href="'+ABS(id)+'" target="_blank" rel="noreferrer">'+esc(t)+'</a>'; }

  function entryCard(e, i){
    var v = VENUE[e.venueClass]||VENUE.pre, s = STATUS[e.status]||STATUS.open;
    var fields = [["现象",e.phenomenon],["值得建模",e.why],["理论现状",e.theory],["切入点",e.entry]]
      .map(function(f){ return '<div class="f"><span class="k">'+f[0]+'</span><span>'+esc(f[1])+'</span></div>'; }).join("");
    var topics = (e.topics||[]).map(function(t){return '<span class="topic">'+esc(t)+'</span>';}).join("");
    return '<article class="card" data-domain="'+(e.domain||"RL")+'" data-venue="'+e.venueClass+'" data-status="'+e.status+'" data-text="'+esc((e.title+" "+e.phenomenon).toLowerCase())+'">'
      + '<div class="hd"><span class="rank">'+(i+1)+'</span><span class="ttl">'+link(e.title,e.id)+'</span></div>'
      + '<div class="badges"><span class="badge '+v.cls+'">'+v.label+' · '+esc(e.venue)+'</span><span class="badge '+s.cls+'">'+s.label+'</span>'+(e.hasRead?'<a class="badge b-read" href="./read-'+e.id+'.html">📖 精读</a>':'')+'</div>'
      + '<div class="authors">'+esc(e.authors)+'</div>'
      + '<div class="fields">'+fields+'</div>'
      + (topics?'<div class="topics">'+topics+'</div>':'')
      + '</article>';
  }

  function render(){
    var html = "";
    // Section I
    var showI = state.section==="all"||state.section==="I";
    if(showI){
      html += '<section class="sec" data-sec="I"><h2 class="sec-h">I. 实验现象 → 候选方向</h2>'
        + '<div class="sec-tag">你要找的"问题"：稳健、反直觉、还没理论的实验现象</div>';
      var order = 0;
      var LABELS = {RL:"强化学习 RL", FL:"联邦学习 · Personalization"};
      var present = {};
      DATA.sectionI.A.concat(DATA.sectionI.B).forEach(function(e){ present[e.domain||"RL"]=true; });
      var doms = ["RL","FL"].filter(function(k){return present[k];});
      Object.keys(present).forEach(function(k){ if(doms.indexOf(k)<0) doms.push(k); });
      var multiDomain = doms.length > 1;
      doms.forEach(function(dk){
        if(state.domain!=="all" && state.domain!==dk) return;
        var aD = DATA.sectionI.A.filter(function(e){return (e.domain||"RL")===dk;});
        var bD = DATA.sectionI.B.filter(function(e){return (e.domain||"RL")===dk;});
        if(!aD.length && !bD.length) return;
        html += '<div class="domain-block">';
        if(multiDomain) html += '<h3 class="domain-h">'+(LABELS[dk]||dk)+'</h3>';
        if(aD.length){ html += '<div class="subh">A · 顶会主会</div>' + aD.map(function(e){return entryCard(e, order++);}).join(""); }
        if(bD.length){ html += '<div class="subh">B · Workshop / 预印本（质量软加分）</div>' + bD.map(function(e){return entryCard(e, order++);}).join(""); }
        html += '</div>';
      });
      html += '<div class="subh" style="color:var(--muted)">本月还扫到（同类现象，未展开）</div><div class="fields">'
        + DATA.sectionI.alsoScanned.map(function(a){return '<div class="f" data-venue="all" data-status="all" data-text="'+esc(a.title.toLowerCase())+'"><span class="k">·</span><span>'+link(a.title,a.id)+' — '+esc(a.note)+'</span></div>';}).join("")
        + '</div>';
      html += '</section>';
    }
    // Section II
    if(state.section==="all"||state.section==="II"){
      html += '<section class="sec" data-sec="II"><h2 class="sec-h">II. 理论前沿</h2>'
        + '<div class="sec-tag">别人做到哪了（按工具分组，★ = 直接针对某实验现象/算法，可能已把方向填掉）</div>';
      html += DATA.sectionII.map(function(g){
        return '<div class="tgroup"><h4>'+esc(g.group)+'</h4>'
          + g.items.map(function(it){
              return '<div class="titem" data-text="'+esc((it.title+" "+it.note).toLowerCase())+'">'
                + (it.star?'<span class="star">★</span>':'')
                + link(it.title,it.id)+' <span class="badge b-pre">'+esc(it.venue)+'</span>'
                + '<div class="note">'+esc(it.note)+'</div></div>';
            }).join("")
          + '</div>';
      }).join("");
      html += '</section>';
    }
    // Section III
    if(state.section==="all"||state.section==="III"){
      html += '<section class="sec" data-sec="III"><h2 class="sec-h">III. 历史开放现象 backlog</h2>'
        + '<div class="sec-tag">候选方向库（种子）· 每条"空不空"须 Semantic Scholar + key 前向引用复核</div>';
      html += DATA.sectionIII.map(function(b){
        var s = STATUS[b.status]||STATUS.open;
        return '<div class="blitem" data-text="'+esc((b.name+" "+b.note).toLowerCase())+'"><span class="badge '+s.cls+'">'+s.label+'</span>'
          + '<span><strong>'+esc(b.name)+'</strong> — '+esc(b.note)+'</span></div>';
      }).join("");
      html += '</section>';
    }
    document.getElementById("app").innerHTML = html;
    applyFilters();
    if(window.renderMathInElement){
      renderMathInElement(document.getElementById("app"),{delimiters:[{left:"$",right:"$",display:false}],throwOnError:false});
    }
  }

  function applyFilters(){
    var q = state.q.trim().toLowerCase();
    document.querySelectorAll('#app .card').forEach(function(el){
      var ok = (state.venue==="all"||el.dataset.venue===state.venue)
            && (state.status==="all"||el.dataset.status===state.status)
            && (!q || (el.dataset.text||"").indexOf(q)>=0);
      el.style.display = ok?"":"none";
    });
    // text search also filters II/III/alsoScanned rows
    document.querySelectorAll('#app .titem, #app .blitem, #app .f[data-text]').forEach(function(el){
      var ok = (!q || (el.dataset.text||"").indexOf(q)>=0);
      el.style.display = ok?"":"none";
    });
  }

  function chipRow(container, opts, key){
    var box = document.getElementById(container);
    box.innerHTML = "";
    opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "chip"; b.textContent = o.label; b.setAttribute("aria-pressed", state[key]===o.val);
      b.addEventListener("click", function(){
        state[key]=o.val;
        [].forEach.call(box.children,function(c){c.setAttribute("aria-pressed", c===b);});
        if(key==="section"||key==="domain") render(); else applyFilters();
      });
      box.appendChild(b);
    });
  }
  chipRow("f-section",[{val:"all",label:"全部"},{val:"I",label:"I 实验现象"},{val:"II",label:"II 理论前沿"},{val:"III",label:"III backlog"}],"section");
  (function(){
    var LAB={RL:"RL", FL:"FL·个性化"}, seen={};
    DATA.sectionI.A.concat(DATA.sectionI.B).forEach(function(e){ seen[e.domain||"RL"]=true; });
    var ks=Object.keys(seen);
    if(ks.length<=1){ document.getElementById("f-domain").closest(".cgroup").style.display="none"; }
    else { chipRow("f-domain",[{val:"all",label:"全部"}].concat(ks.map(function(k){return {val:k,label:LAB[k]||k};})),"domain"); }
  })();
  chipRow("f-venue",[{val:"all",label:"全部"},{val:"main",label:"主会"},{val:"ws",label:"Workshop"},{val:"pre",label:"预印本"}],"venue");
  chipRow("f-status",[{val:"all",label:"全部"},{val:"open",label:"真 gap"},{val:"partial",label:"半覆盖"},{val:"filled",label:"经典已覆盖"}],"status");
  document.getElementById("f-q").addEventListener("input", function(e){ state.q=e.target.value; applyFilters(); });

  render();
  // KaTeX's CDN scripts are deferred, so they load after this inline script runs.
  // Re-typeset once they're ready (render()'s own guarded call handles later re-renders).
  window.addEventListener("load", function(){
    if(window.renderMathInElement){
      renderMathInElement(document.getElementById("app"),{delimiters:[{left:"$",right:"$",display:false}],throwOnError:false});
    }
  });
})();
</script>
</body>
</html>
