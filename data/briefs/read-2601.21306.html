<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>精读骨架</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  :root{
    --bg:#fff8f7; --panel:#ffffff; --panel-soft:#fff0ef; --panel-tint:#ffe9e7;
    --ink:#251818; --muted:#584140; --line:#201615;
    --primary:#ff6b6b; --primary-dark:#ae2f34; --secondary:#b1eeed; --secondary-dark:#2a6767;
    --tertiary:#9897c5; --yellow:#f2d95c;
    --shadow:6px 6px 0 0 var(--line); --shadow-sm:4px 4px 0 0 var(--line);
    --border:4px solid var(--line); --border-thin:2px solid var(--line);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:17px;
    font-family:"Archivo Narrow","Arial Narrow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}
  a{color:var(--primary-dark);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1000px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}
  header.top{padding:24px clamp(16px,4vw,44px) 20px;border-bottom:6px solid var(--line);background:var(--panel)}
  .back{font-size:14px;color:var(--muted)}
  header.top h1{margin:6px 0 2px;font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:clamp(24px,3.4vw,38px);line-height:1.06}
  .meta{color:var(--muted);font-size:15px;margin:6px 0 0}
  .srclinks a{display:inline-block;margin:8px 8px 0 0;border:var(--border-thin);padding:3px 10px;box-shadow:2px 2px 0 0 var(--line);font-size:14px;background:var(--panel)}
  .hook{max-width:1000px;margin:18px auto 0;padding:12px 16px;border:var(--border-thin);background:var(--panel-tint);box-shadow:var(--shadow-sm);font-weight:700}
  .howto{max-width:1000px;margin:14px auto 0;padding:10px 16px;border-left:6px solid var(--tertiary);background:var(--panel-soft);color:var(--muted);font-size:14.5px;line-height:1.55}
  main{padding:8px clamp(14px,3vw,28px) 80px}
  .blk{max-width:1000px;margin:26px auto 0}
  .blk h3{font-family:Georgia,serif;font-weight:900;font-size:21px;margin:0 0 10px;display:inline-block;border-bottom:6px solid var(--primary);padding-bottom:2px}
  .node{border:var(--border);background:var(--panel);box-shadow:var(--shadow);padding:12px 15px;margin:0 0 14px}
  .node:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 0 var(--line)}
  .claim{font-size:16.5px;line-height:1.5}
  .claim b{color:var(--primary-dark)}
  .ptr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
  .loc{font-size:12.5px;font-weight:800;border:var(--border-thin);padding:2px 8px;border-radius:2px;background:var(--panel-tint);white-space:nowrap}
  .src{font-size:13px;font-weight:800;border:var(--border-thin);padding:2px 9px;box-shadow:2px 2px 0 0 var(--line);background:var(--yellow);color:var(--ink)}
  .src:hover{background:var(--primary);color:#fff;text-decoration:none}
  .kw{font-size:12.5px;color:var(--muted)}
  .kw code{background:var(--panel-soft);border:1px solid var(--line);padding:0 5px;border-radius:2px}
  .mine{border-left:6px solid var(--secondary-dark);background:var(--panel-soft)}
  .mine .tag{font-size:11px;font-weight:800;color:var(--secondary-dark);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  footer{max-width:1000px;margin:0 auto;padding:18px clamp(14px,3vw,28px) 60px;color:var(--muted);font-size:13px;border-top:var(--border-thin)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="back"><a id="r-back" href="./index.html">← 返回简报</a></div>
    <h1 id="r-title">精读骨架</h1>
    <p class="meta" id="r-meta"></p>
    <div class="srclinks" id="r-srclinks"></div>
  </div>
</header>

<div class="hook" id="r-hook"></div>
<div class="howto">怎么对照：每个骨架点下方 <span class="src">→原文</span> 会跳到来源的<b>对应章节/图表</b>（有 arXiv HTML 时精确到节；否则跳 PDF 页）；<code>搜:</code> 后是可在 PDF/HTML 里 Ctrl-F 的短关键词。骨架是模型精读所得——先扫骨架，存疑处点 →原文 核对，结论以原文为准。</div>

<main id="r-main"></main>
<footer>骨架为模型精读所得，可能有误；每点的「→原文」即为回原文的核对入口。公式由 KaTeX 渲染（需联网）。</footer>

<script type="application/json" id="read-data">
{
  "id": "2601.21306",
  "title": "The Surprising Difficulty of Search in Model-Based RL",
  "authors": "Chang, Henaff, Amos & Dudek",
  "venue": "ICML 2026",
  "briefMonth": "2026-07",
  "srcAbs": "https://arxiv.org/abs/2601.21306",
  "srcPdf": "https://arxiv.org/pdf/2601.21306",
  "srcHtml": "",
  "hook": "一句话：即使世界模型<b>高度准确</b>，加 search 也会<b>损害</b>性能；真正该修的是 <b>overestimation bias</b>（不是模型/值函数精度），对 value ensemble 取 <b>min</b> 就能解锁有效 search 并达 SOTA。<br>⚠ 本篇 arXiv <b>无 HTML</b> → 无精确锚点：请用每条 <code>搜:</code> 的关键词在 PDF（见顶部链接）里 Ctrl-F 定位；措辞以 v2 为准（v1 曾表述为 distribution shift）。",
  "blocks": [
    {
      "h": "0 · 现象（你要判断的“问题”）",
      "nodes": [
        {"claim": "在 model-based RL 里，<b>即使模型高度准确，加 search 也可能损害性能</b>——search 不是「学好的 policy」的即插即用替代。", "loc": "摘要 · §1（PDF）", "kw": "search can harm"}
      ]
    },
    {
      "h": "1 · 反直觉点（挑战的公论）",
      "nodes": [
        {"claim": "主流认为 model-based RL 的主要障碍是<b>长程预测与 compounding error</b>。本文<b>挑战</b>这一公论：模型精度不是关键瓶颈。", "loc": "摘要 · §1（PDF）", "kw": "compounding errors"}
      ]
    },
    {
      "h": "2 · 真正病因（核心主张，v2）",
      "nodes": [
        {"claim": "真正更重要的是<b>缓解 overestimation bias</b>，而非提升模型或值函数精度。（注：v1 摘要此处表述为 distribution shift；v2 收敛到 overestimation bias。）", "loc": "摘要 · 分析节（PDF）", "kw": "overestimation bias"}
      ]
    },
    {
      "h": "3 · 修法",
      "nodes": [
        {"claim": "对<b>一组值函数取 minimum</b>（ensemble-min）有效地压住该 bias，从而让 search 真正奏效。", "loc": "方法节（PDF）", "kw": "minimum over an ensemble"}
      ]
    },
    {
      "h": "4 · 结果",
      "nodes": [
        {"claim": "在多个主流 benchmark 域达到 <b>SOTA</b>。", "loc": "实验节（PDF）", "kw": "state-of-the-art"}
      ]
    },
    {
      "h": "5 · 说明（无 HTML 的兜底）",
      "nodes": [
        {"claim": "本篇 arXiv 未提供 HTML，故无逐节可点锚点。<b>对照方式</b>：打开顶部 PDF 链接，用上面各条的 <code>搜:</code> 关键词 Ctrl-F 跳到对应处。等作者放出 HTML 版后可升级为精确锚点。", "loc": "全篇（PDF）"}
      ]
    },
    {
      "h": "6 · 对你的理论切入点",
      "nodes": [
        {"mine": true, "tag": "简报观点（非论文原文）", "claim": "把 planning 的 <b>max/argmax 算子当成值高估的放大器</b>，用 order-statistics 刻画「search 深度/宽度 × 值误差」如何放大 overestimation；证 <b>ensemble-min 的偏差压缩率</b>，并求「模型精度到多高时 search 仍劣于直接用 policy」的临界判据。", "loc": "衔接 病因 / 修法"}
      ]
    }
  ]
}
</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById("read-data").textContent);
  var esc = function(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
  document.title = "精读 · " + (D.title||"") + (D.id?(" ("+D.id+")"):"");
  document.getElementById("r-title").textContent = "精读骨架 · " + (D.title||"");
  document.getElementById("r-meta").textContent = [D.authors, D.venue, D.id?("arXiv "+D.id):""].filter(Boolean).join(" · ");
  document.getElementById("r-back").href = "./" + (D.briefMonth ? (D.briefMonth+".html") : "index.html");
  var sl = document.getElementById("r-srclinks");
  [["abstract", D.srcAbs], ["PDF", D.srcPdf], [D.srcHtml ? "HTML(可锚点)" : "", D.srcHtml]].forEach(function(x){
    if(!x[0]||!x[1]) return;
    var a=document.createElement("a"); a.href=x[1]; a.target="_blank"; a.rel="noreferrer"; a.textContent=x[0]; sl.appendChild(a);
  });
  document.getElementById("r-hook").innerHTML = D.hook || "";
  var base = D.srcHtml || D.srcPdf || "";
  var main = document.getElementById("r-main");
  (D.blocks||[]).forEach(function(b){
    var sec=document.createElement("section"); sec.className="blk";
    var h=document.createElement("h3"); h.textContent=b.h; sec.appendChild(h);
    (b.nodes||[]).forEach(function(n){
      var node=document.createElement("div"); node.className="node"+(n.mine?" mine":"");
      var html="";
      if(n.mine && n.tag) html+='<div class="tag">'+esc(n.tag)+'</div>';
      html+='<div class="claim">'+(n.claim||"")+'</div>';
      var ptr="";
      if(n.loc) ptr+='<span class="loc">'+esc(n.loc)+'</span>';
      (n.anchors||[]).forEach(function(a){ ptr+='<a class="src" href="'+(base+(a.frag||""))+'" target="_blank" rel="noreferrer">'+esc(a.label||"→原文")+'</a>'; });
      if(n.kw) ptr+='<span class="kw">搜:<code>'+esc(n.kw)+'</code></span>';
      if(ptr) html+='<div class="ptr">'+ptr+'</div>';
      node.innerHTML=html; sec.appendChild(node);
    });
    main.appendChild(sec);
  });
  window.addEventListener("load", function(){
    if(window.renderMathInElement){
      renderMathInElement(document.body,{delimiters:[{left:"$",right:"$",display:false}],throwOnError:false});
    }
  });
})();
</script>
</body>
</html>
